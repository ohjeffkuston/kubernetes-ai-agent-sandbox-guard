[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes-ai-agent-sandbox-guard"
version = "1.0.0"
description = "Deterministic admission evidence for Kubernetes AI-agent sandboxes"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
agent-sandbox-guard = "agent_sandbox_guard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

