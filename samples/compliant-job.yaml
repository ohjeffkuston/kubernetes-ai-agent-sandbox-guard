workload:
  apiVersion: batch/v1
  kind: Job
  metadata: {name: agent-code-sandbox}
  spec:
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 120
    template:
      spec:
        runtimeClassName: gvisor
        automountServiceAccountToken: false
        restartPolicy: Never
        securityContext:
          runAsNonRoot: true
          seccompProfile: {type: RuntimeDefault}
        containers:
          - name: runner
            image: ghcr.io/example/agent-runner@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            securityContext:
              runAsNonRoot: true
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
            resources:
              requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 256Mi}
              limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 1Gi}
sandbox:
  pids_max: 64
  secrets_exposed: false
  provenance_verified: true
  egress:
    default_deny: true
    metadata_api_blocked: true
    allowlist: [api.openai.com:443]
operations:
  owner: platform-security
  runbook: https://runbooks.example/sandbox
  audit_sink: otlp://audit-collector:4317
  alert_route: pagerduty://platform-security
  human_approval_required: true

